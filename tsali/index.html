#stage{position:relative;flex:none;width:1920px;height:1080px;background:var(--paper);overflow:hidden;transform-origin:center center;
  background-image:radial-gradient(ellipse at 30% 20%,rgba(255,255,255,.55),rgba(255,255,255,0) 60%),
                   radial-gradient(ellipse at 80% 90%,rgba(210,180,140,.18),rgba(0,0,0,0) 55%)}
.scene{position:absolute;inset:0;opacity:0;visibility:hidden}
.scene.on{visibility:visible}
.art{position:absolute;left:70px;top:70px;width:1060px;height:940px}
.space{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.space img,.space canvas{position:absolute;left:0;top:0;pointer-events:none}
.space img.layer{transform-origin:50% 50%}
.text{position:absolute;left:1210px;top:0;width:640px;height:1080px;display:flex;flex-direction:column;justify-content:center;gap:54px}
.line{opacity:0;transform:translateY(14px);position:relative}
.line .syl{font-family:"Syl";font-weight:700;font-size:60px;line-height:1.15;color:var(--ink);letter-spacing:.01em}
.line .rom{font-family:"Rom";font-size:36px;line-height:1.2;color:var(--dim);margin-top:8px;font-style:italic}
.line .en{font-family:"Rom";font-size:32px;line-height:1.25;color:var(--dim);margin-top:10px}
.line.active .syl{color:var(--accent)}
.line.active .rom{color:var(--ink)}
.line .cue{position:absolute;left:-46px;top:16px;width:26px;height:26px;border-radius:50%;border:3px solid var(--accent);opacity:0}
.line.active .en{color:var(--ink)}
/* toggles: hidden rows, and the first row that is still showing takes the lead */
body.no-syl .line .syl,body.no-rom .line .rom,body.no-en .line .en{display:none}
body.no-text .text{visibility:hidden}
body.no-syl .line .rom{font-size:52px;font-style:normal;color:var(--ink);margin-top:0}
body.no-syl .line.active .rom{color:var(--accent)}
body.no-syl.no-rom .line .en{font-size:48px;color:var(--ink);margin-top:0}
body.no-syl.no-rom .line.active .en{color:var(--accent)}
body.no-syl .scene.cover .line .rom{font-size:80px}
body.no-syl.no-rom .scene.cover .line .en{font-size:72px}
.scene.cover .line .en{font-size:38px;margin-top:14px}
.scene.cover .line.active .rom,.scene.cover .line.active .en{color:var(--ink)}
.pageno{position:absolute;right:60px;bottom:40px;font-size:30px;color:var(--dim);font-family:"Rom"}
/* cover layout */
.scene.cover .art{left:520px;top:110px;width:600px;height:600px}
.scene.cover .text{left:0;top:720px;width:1920px;height:300px;align-items:center;justify-content:flex-start;gap:0}
.scene.cover .line{text-align:center}
.scene.cover .line .syl{font-size:96px}
.scene.cover .line.active .syl{color:var(--ink)}
.scene.cover .line .rom{font-size:46px}
.scene.cover .credit{position:absolute;bottom:34px;width:100%;text-align:center;font-size:24px;color:var(--dim);font-family:"Rom"}
/* interactive chrome */
#bar{position:absolute;left:0;right:0;bottom:0;min-height:64px;box-sizing:border-box;flex-wrap:wrap;row-gap:8px;padding-top:10px!important;padding-bottom:10px!important;background:rgba(20,15,12,.92);color:#eee;display:flex;align-items:center;gap:14px;padding:0 18px;font-size:16px;z-index:50}
#bar button{background:#3a2e26;color:#f4ead8;border:0;border-radius:6px;padding:8px 14px;font-size:16px;cursor:pointer;font-family:inherit}
#bar button.primary{background:#b5442d}
#bar button:disabled{opacity:.4}
#bar .sp{flex:1}
#bar label{display:flex;gap:6px;align-items:center;cursor:pointer}
#pages{display:flex;gap:4px}
#pages button{padding:6px 9px;font-size:14px}
#pages button.cur{background:#b5442d}
#pages{flex-wrap:wrap}
#bar .group{display:flex;gap:4px;align-items:center}
#bar button.chip{background:transparent;border:1px solid #6b5a4c;color:#b9ab9a;border-radius:999px;padding:6px 11px;font-size:14px}
#bar button.chip[aria-pressed="true"]{background:#5a3a2c;border-color:#c9785f;color:#fff}
#bar button.tog[aria-pressed="true"]{background:#f4ead8;color:#2b2118}
#bar .group.off{opacity:.4;pointer-events:none}
#bar .syl-chip{font-family:"Syl"}
#bar button:focus-visible{outline:2px solid #f0a53c;outline-offset:2px}
body.render #bar{display:none}

<script>
/* Per-page animations for Tsinadvneho'i Tsali Tsalagi.
   Each fx(t,c) gets scene-local time t (s) and c={S,ctx,iw,ih,lines,active,layers,dur,gapLine,gapT}.
   Coordinates are in the illustration's own pixel space. Helpers (eyelids, blinkOpen, zz, scribble,
   smooth, clamp, rnd, SKIN, LINE) live in index.html. */
window.FX={};
const hide=(c,n)=>{if(c.layers[n])c.layers[n].el.style.opacity=0;};
const sweep=(el,cx,cy,p)=>{ // reveal a layer clockwise from 12 o'clock around (cx,cy) in layer-% coords
  if(p<=0){el.style.opacity=0;return;}el.style.opacity=1;if(p>=1){el.style.clipPath='none';return;}
  const pts=[`${cx}% ${cy}%`];const n=40;for(let i=0;i<=n;i++){const a=-Math.PI/2+p*Math.PI*2*i/n;pts.push(`${cx+Math.cos(a)*150}% ${cy+Math.sin(a)*150}%`);}
  el.style.clipPath=`polygon(${pts.join(',')})`;};
const during=(c,i)=>c.active===i;                       // is line i the one being spoken (or just spoken)?
const speaking=(t,l)=>t>=l.start-0.2&&t<=l.end+0.2;     // narrator is on this line
const pencil=(ctx,color,w)=>{ctx.strokeStyle=color;ctx.lineWidth=w;ctx.lineCap='round';ctx.lineJoin='round';};
function zoom(c,t,amt,ox,oy){const s=1+amt*smooth(t/c.dur);c.S.base.style.transform=`scale(${s})`;c.S.base.style.transformOrigin=`${ox}% ${oy}%`;return s;}
function sparkle(ctx,x,y,r,a,color){ctx.save();ctx.globalAlpha=a;ctx.strokeStyle=color;ctx.lineWidth=3;ctx.lineCap='round';
  for(let k=0;k<4;k++){const an=k*Math.PI/4;ctx.beginPath();ctx.moveTo(x+Math.cos(an)*r*.35,y+Math.sin(an)*r*.35);ctx.lineTo(x+Math.cos(an)*r,y+Math.sin(an)*r);ctx.stroke();}ctx.restore();}
function drop(ctx,x,y,r,a){ctx.save();ctx.globalAlpha=a;ctx.fillStyle='rgba(170,200,240,.6)';ctx.strokeStyle='rgba(90,130,200,.8)';ctx.lineWidth=2.5;
  ctx.beginPath();ctx.moveTo(x,y-r*1.6);ctx.quadraticCurveTo(x+r*1.3,y,x,y+r);ctx.quadraticCurveTo(x-r*1.3,y,x,y-r*1.6);ctx.fill();ctx.stroke();ctx.restore();}

/* 0 — cover */
FX[0]=function(t,c){
  const s=zoom(c,t,0.06,50,60);
  c.ctx.save();c.ctx.translate(c.iw/2,c.ih*0.6);c.ctx.scale(s,s);c.ctx.translate(-c.iw/2,-c.ih*0.6);
  eyelids(c.ctx,[{x:310,y:455,rx:46,ry:68,flat:1},{x:445,y:450,rx:46,ry:68,flat:1}],blinkOpen(t,[1.9,3.1]),c.S.base);c.ctx.restore();
};

/* 1 — wakes up: asleep through the habitual line and the question; alarm rings and eyes open on "Ayega" */
FX[1]=function(t,c){
  const L=c.lines,wake=L[2].start-0.55;
  const eyes=[{x:802,y:383,rx:40,ry:46},{x:900,y:383,rx:38,ry:46}];
  let open=t<wake?0:smooth((t-wake-0.35)/0.35);
  if(t>wake+1.2)open=Math.min(open,blinkOpen(t,[wake+2.6]));
  const br=t<wake?0.006*Math.sin(t*2.2):0;c.S.base.style.transform=`scale(${1+br})`;c.S.base.style.transformOrigin='50% 100%';
  eyelids(c.ctx,eyes,open,c.S.base);
  if(t<wake) zz(c.ctx,1010,250,t,120);
  const k=c.layers.clock.el;const rings=['ring1','ring2','ring3'].map(n=>c.layers[n].el);
  if(t<wake){k.style.transform='rotate(0deg)';rings.forEach(r=>r.style.opacity=0);}
  else{const a=Math.min(1,(t-wake)/0.1);const ring=t-wake;const decay=ring<2.2?1:Math.max(0,1-(ring-2.2)/0.8);
    const ang=Math.sin(ring*42)*9*a*decay;k.style.transform=`rotate(${ang}deg) translateY(${-Math.abs(Math.sin(ring*21))*10*decay}px)`;
    rings.forEach((r,i)=>{r.style.opacity=decay*(0.6+0.4*Math.abs(Math.sin(ring*30+i)));r.style.transform=`scale(${1+0.08*Math.sin(ring*30+i*2)})`;});}
};

/* 2 — bathes: bubbles and steam, busier on "Adawo'a" */
FX[2]=function(t,c){
  const s=zoom(c,t,0.03,50,80);const ctx=c.ctx;ctx.save();ctx.translate(c.iw/2,c.ih*0.8);ctx.scale(s,s);ctx.translate(-c.iw/2,-c.ih*0.8);
  const busy=c.active===2?1.8:1;
  for(let i=0;i<14;i++){const life=2.6+rnd(i)*1.6,ph=((t*busy+rnd(i+50)*life)%life)/life;
    const x=560+rnd(i+7)*820+Math.sin(t*1.3+i)*22,y=640-ph*420,r=14+rnd(i+13)*26;
    ctx.globalAlpha=ph<0.15?ph/0.15:(ph>0.85?(1-ph)/0.15:1);scribble(ctx,x,y,r*(0.7+0.3*ph),t,i);}
  ctx.globalAlpha=1;ctx.strokeStyle='rgba(150,150,170,.35)';ctx.lineWidth=6;
  for(let i=0;i<4;i++){const ph=(t*0.25+i*0.27)%1;ctx.globalAlpha=Math.sin(ph*Math.PI)*.6;ctx.beginPath();const x0=700+i*260;
    for(let y=0;y<220;y+=10){const x=x0+Math.sin((y/40)+t*1.5+i)*18;y===0?ctx.moveTo(x,560-ph*300):ctx.lineTo(x,560-ph*300-y);}ctx.stroke();}
  ctx.restore();
};

/* 3 — washes face: he scrubs with the cloth, the tap runs, water flies */
FX[3]=function(t,c){
  const ctx=c.ctx;zoom(c,t,0.03,60,40);
  [[450,150],[520,130],[585,105],[640,85]].forEach(([x,y],i)=>{const g=ctx.createRadialGradient(x,y,5,x,y,70);const a=0.3+0.15*Math.sin(t*3+i);
    g.addColorStop(0,`rgba(255,240,120,${a})`);g.addColorStop(1,'rgba(255,240,120,0)');ctx.fillStyle=g;ctx.fillRect(x-70,y-70,140,140);});
  ctx.save();pencil(ctx,'rgba(120,160,220,.7)',7);ctx.beginPath();for(let y=690;y<=760;y+=6){const x=560+Math.sin(y*0.15+t*14)*2;y===690?ctx.moveTo(x,y):ctx.lineTo(x,y);}ctx.stroke();ctx.restore();
  for(let i=0;i<5;i++){const ph=(t*1.6+i*0.2)%1;drop(ctx,585+i*22+Math.sin(i)*10,745+ph*20,5,1-ph);}

  if(scrub){for(let i=0;i<9;i++){const life=0.7,ph=((t+rnd(i+3)*life)%life)/life;const an=-Math.PI*0.9+rnd(i+11)*Math.PI*1.1;

/* 4 — looks at himself in a hand mirror (the brush head is repainted as glass) */
FX[4]=function(t,c){
  const ctx=c.ctx,base=c.S.base;zoom(c,t,0.03,45,45);
  const g=c.layers.glass;const [gx,gy,gw,gh]=[g.x,g.y,g.w,g.h];
  // glints sweep across the glass: once per spoken statement
  for(const l of [c.lines[0],c.lines[2]]){const u=clamp((t-(l.start-0.1))/1.1,0,1);if(u<=0||u>=1)continue;
    ctx.save();ctx.beginPath();ctx.rect(gx,gy,gw,gh);ctx.clip();ctx.globalCompositeOperation='source-over';

};

/* 5 — combs hair: the arm and comb stroke through the hair */
FX[5]=function(t,c){
  zoom(c,t,0.03,45,45);const k=c.layers.arm.el;
  const on=t<c.lines[0].start||c.lines.some((l,i)=>i!==1&&speaking(t,l));

/* 6 — puts on the sweater: tugs it down */
FX[6]=function(t,c){
  zoom(c,t,0.025,50,60);const b=c.layers.top.el;

/* 7 — drinks milk through the straw: milk runs up the straw, cheeks puff, the level in the glass drops */
FX[7]=function(t,c){
  const ctx=c.ctx;zoom(c,t,0.03,45,45);
  const sip=t<c.lines[0].start||c.lines.some((l,i)=>i!==1&&speaking(t,l));
  const x0=850,y0=1040,x1=797,y1=470;
  if(sip){ctx.save();ctx.strokeStyle='rgba(255,255,255,.95)';ctx.lineWidth=8;ctx.lineCap='round';
    for(let i=0;i<7;i++){const ph=((t*0.7)+i/7)%1;const y=y0+(y1-y0)*ph,x=x0+(x1-x0)*ph;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+(x1-x0)*0.035,y+(y1-y0)*0.035);ctx.stroke();}ctx.restore();}

  for(let i=0;i<4;i++){const ph=(t*0.32+i*0.25)%1;ctx.save();ctx.globalAlpha=Math.sin(ph*Math.PI)*.5;pencil(ctx,'rgba(150,150,165,.85)',6);ctx.beginPath();

};

/* 10 — draws on the board: circle, then square, then the triangle under his chalk */

<script>
const W=1920,H=1080,XF=0.6;
const IMG={0:[763,765],1:[1865,1190],2:[1852,1329],3:[745,1295],4:[1177,1316],5:[1177,1316],6:[1464,1343],7:[1756,1238],8:[1455,1421],9:[1643,1090],10:[1163,1268],11:[2039,1656],12:[1874,1513]};
// cut-out layers per page: name -> [x,y,w,h, originX, originY] (image space)
const LAYERS=window.LAYERS||{};
const PAGES_WITH_FX=new Set(Object.keys(FX_TABLE()).map(Number));
function FX_TABLE(){return window.FX||{};}
const SKIN='rgb(243,204,158)', LINE='rgba(110,60,40,.85)';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), lerp=(a,b,t)=>a+(b-a)*t, ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

// deterministic pseudo-random
function rnd(seed){let s=Math.sin(seed*12.9898+78.233)*43758.5453;return s-Math.floor(s)}

/* ---------- scene construction ---------- */
function buildScene(sc){
  const p=sc.page,[iw,ih]=IMG[p];
  const el=document.createElement('div');el.className='scene'+(p===0?' cover':'');
  const art=document.createElement('div');art.className='art';
  const space=document.createElement('div');space.className='space';space.style.width=iw+'px';space.style.height=ih+'px';
  const base=new Image();base.src=IMGDATA[`p${String(p).padStart(2,'0')}`];base.className='base';base.width=iw;base.height=ih;space.appendChild(base);
  const layers={};
  for(const [name,[x,y,w,h,ox,oy]] of Object.entries(LAYERS[p]||{})){
    const im=new Image();im.src=IMGDATA[`p${String(p).padStart(2,'0')}_${name}`];im.className='layer';
    im.style.left=x+'px';im.style.top=y+'px';im.width=w;im.height=h;im.style.transformOrigin=`${ox*100}% ${oy*100}%`;
    space.appendChild(im);layers[name]={el:im,x,y,w,h};
  }
  const cv=document.createElement('canvas');cv.width=iw;cv.height=ih;space.appendChild(cv);
  art.appendChild(space);el.appendChild(art);
  const text=document.createElement('div');text.className='text';
  const lineEls=sc.lines.map(l=>{const d=document.createElement('div');d.className='line';
    d.innerHTML=`<div class="cue"></div><div class="syl">${l.syl}</div><div class="rom">${l.rom}</div><div class="en">${l.en||''}</div>`;text.appendChild(d);return d;});
  el.appendChild(text);
  if(p===0){const c=document.createElement('div');c.className='credit';c.textContent='Illustrations: Shannon Whitelock and friends · © 2005 Indigenous Language Institute';el.appendChild(c);}
  else{const n=document.createElement('div');n.className='pageno';n.textContent=p;el.appendChild(n);}
  // fit image into art box
  const fit=()=>{const bw=art.clientWidth,bh=art.clientHeight;const s=Math.min(bw/iw,bh/ih);space.style.transform=`translate(${(bw-iw*s)/2}px,${(bh-ih*s)/2}px) scale(${s})`;return s;};
  return {sc,el,art,space,base,layers,cv,ctx:cv.getContext('2d'),lineEls,fit,iw,ih};
}

/* ---------- drawing one scene at local time lt ---------- */
function drawScene(S,lt){
  const {sc,lineEls,ctx,iw,ih}=S;
  if(!S.fitted){S.fit();S.fitted=true;}
  let active=-1,phase='pre',gapLine=-1,gapT=0;
  sc.lines.forEach((l,i)=>{
    const e=lineEls[i];const a=clamp((lt-(l.start-0.3))/0.3,0,1);
    e.style.opacity=a===0?0:(lt>l.end&&i!==active?0.62:1);
    e.style.transform=`translateY(${14*(1-ease(a))}px)`;
    const isActive=lt>=l.start-0.3&&lt<=l.end+0.15;
    e.classList.toggle('active',isActive);if(isActive)active=i;
    const cue=e.querySelector('.cue');
    if(l.gap&&!l.nocue&&lt>l.end+0.15&&lt<l.end+l.gap){gapLine=i;gapT=lt-l.end;
      cue.style.opacity=0.35+0.65*Math.abs(Math.sin(gapT*3.2));cue.style.transform=`scale(${1+0.15*Math.abs(Math.sin(gapT*3.2))})`;
      e.style.opacity=1;e.classList.add('active');}
    else cue.style.opacity=0;
  });
  if(active<0){for(let i=sc.lines.length-1;i>=0;i--)if(lt>sc.lines[i].end){active=i;break;}}
  ctx.clearRect(0,0,iw,ih);
  const fx=FX_TABLE()[sc.page];
  if(fx)fx(lt,{S,ctx,iw,ih,lines:sc.lines,active,layers:S.layers,dur:sc.dur,gapLine,gapT});
  else{S.space.style.transform;S.base.style.transform=`scale(${1+0.02*smooth(lt/sc.dur)})`;S.base.style.transformOrigin='50% 50%';}
}

/* ---------- animation helpers ---------- */
function eyelids(ctx,eyes,open,base){ // eyes: [{x,y,rx,ry}], open 0..1; lids textured from the cheek below each eye
  if(open>=1)return;
  for(const e of eyes){ctx.save();ctx.beginPath();ctx.ellipse(e.x,e.y,e.rx*1.12,e.ry*1.15,0,0,Math.PI*2);ctx.clip();
    const top=e.y-e.ry*1.3,cover=(1-open)*e.ry*2.5,edge=top+cover;const ph=e.ry*2.6,pw=e.rx*2.8;
    ctx.fillStyle=SKIN;ctx.fillRect(e.x-pw/2,top-10,pw,cover+10);
    if(e.flat){ctx.strokeStyle='rgba(205,140,90,.28)';ctx.lineWidth=2;for(let k=-3;k<8;k++){ctx.beginPath();ctx.moveTo(e.x-pw/2+k*e.rx*.5,edge);ctx.lineTo(e.x-pw/2+k*e.rx*.5+e.ry*1.6,edge-e.ry*2.6);ctx.stroke();}}
    else{try{ctx.globalAlpha=0.85;ctx.drawImage(base,e.x-pw/2,e.y+e.ry*1.25,pw,ph,e.x-pw/2,edge-ph,pw,ph);ctx.globalAlpha=1;}catch(err){}}
    ctx.strokeStyle=LINE;ctx.lineWidth=Math.max(4,e.rx*.11);ctx.lineCap='round';ctx.beginPath();ctx.moveTo(e.x-e.rx*.9,edge-e.ry*.16);
    ctx.quadraticCurveTo(e.x,edge+e.ry*.16,e.x+e.rx*.9,edge-e.ry*.16);ctx.stroke();ctx.restore();}
}
function blinkOpen(t,times){ // returns openness 0..1 given blink moments
  let o=1;for(const b of times){const d=t-b;if(d>0&&d<0.24)o=Math.min(o,d<0.1?1-d/0.1:(d-0.1)/0.14);}return o;
}
function zz(ctx,x,y,t,scale){ // floating Z z z
  for(let k=0;k<3;k++){const ph=(t*0.55+k*0.33)%1;const s=scale*(0.55+0.45*ph);
    ctx.save();ctx.globalAlpha=ph<0.8?0.85*(1-ph*0.6):0.85*(1-ph*0.6)*(1-(ph-0.8)/0.2);
    ctx.font=`italic bold ${s}px Rom`;ctx.fillStyle='#6b5a8c';ctx.fillText('z',x+ph*70+k*8,y-ph*160);ctx.restore();}
}
function scribble(ctx,x,y,r,t,seed){ // pencil-ish bubble circle
  ctx.save();ctx.translate(x,y);ctx.strokeStyle='rgba(120,150,210,.75)';ctx.lineWidth=3;ctx.fillStyle='rgba(190,215,245,.28)';
  ctx.beginPath();for(let a=0;a<=Math.PI*2+0.1;a+=Math.PI/14){const j=1+0.06*Math.sin(a*5+seed*7+t);const px=Math.cos(a)*r*j,py=Math.sin(a)*r*j;a===0?ctx.moveTo(px,py):ctx.lineTo(px,py);}
  ctx.closePath();ctx.fill();ctx.stroke();
  ctx.beginPath();ctx.arc(-r*.35,-r*.35,r*.18,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.85)';ctx.fill();ctx.restore();
}


/* ---------- text toggles ---------- */
(function(){
  const st={text:true,syl:true,rom:true,en:true};
  try{const s=JSON.parse(localStorage.getItem('tsali-tsalagi-prefs')||'null');if(s)Object.assign(st,s);}catch(e){}
  const save=()=>{try{localStorage.setItem('tsali-tsalagi-prefs',JSON.stringify(st));}catch(e){}};
  const tt=document.getElementById('textToggle'),chips=document.getElementById('chips');
  function apply(){
    const b=document.body.classList;
    b.toggle('no-text',!st.text);b.toggle('no-syl',!st.syl);b.toggle('no-rom',!st.rom);b.toggle('no-en',!st.en);
    tt.setAttribute('aria-pressed',String(st.text));chips.classList.toggle('off',!st.text);
    chips.querySelectorAll('.chip').forEach(c=>c.setAttribute('aria-pressed',String(st[c.dataset.show])));
  }
  tt.onclick=()=>{st.text=!st.text;apply();save();tt.blur();};
  chips.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{st[c.dataset.show]=!st[c.dataset.show];apply();save();c.blur();});
  addEventListener('keydown',e=>{if(e.key&&e.key.toLowerCase()==='t'&&!e.metaKey&&!e.ctrlKey)tt.click();});
  apply();
})();
/* ---------- render mode ---------- */
const params=new URLSearchParams(location.search);
const stage=document.getElementById('stage');
let SCENES=[];
if(params.get('render')){
  document.body.classList.add('render');
  fetch(`timeline_${params.get('render')}.json`).then(r=>r.json()).then(tl=>{
    SCENES=tl.scenes.map(buildScene);SCENES.forEach(S=>stage.appendChild(S.el));
    window.TOTAL=tl.total;
    window.seek=(t)=>{SCENES.forEach((S,i)=>{const lt=t-S.sc.start;const on=lt>=0&&lt<S.sc.dur+0.05;
      S.el.classList.toggle('on',on);if(!on)return;S.el.style.zIndex=i;
      S.el.style.opacity=i===0?1:clamp(lt/XF,0,1);drawScene(S,lt);});};
    Promise.all([document.fonts.ready,...SCENES.map(S=>new Promise(r=>{S.base.complete?r():S.base.onload=r}))]).then(()=>{window.READY=true;});
  });
}else{
/* ---------- interactive mode ---------- */
  Promise.resolve(PAGES).then(pages=>{
    const audios=pages.map((p,i)=>{const a=new Audio(AUDIODATA[i]);a.preload='auto';return a;});
    const repeatBox=document.getElementById('repeat'),autoBox=document.getElementById('auto');
    const mkScene=(p)=>{const lines=pages[p].lines.map(l=>({...l}));const sc={page:p,start:0,dur:0,lines};
      {let shift=0;lines.forEach((l,i)=>{l.start+=shift;l.end+=shift;if(repeatBox.checked){l.gap=(l.end-l.start)+0.4;}else if(i<lines.length-1){l.gap=0.75;l.nocue=true;}else return;shift+=l.gap;});sc.shift=shift;}
      return sc;};
    let cur=0,S=null,playing=false,t0=0,vt=0,raf=0,segEnd=null;
    const pagesEl=document.getElementById('pages');
    pages.forEach((p,i)=>{const b=document.createElement('button');b.textContent=i===0?'Cover':i;b.onclick=()=>{go(i);};pagesEl.appendChild(b);});
    function layout(){const bh=document.getElementById('bar').offsetHeight||64;const s=Math.min(innerWidth/W,(innerHeight-bh)/H);stage.style.transform=`scale(${s})`;stage.style.marginBottom=bh+'px';if(S)S.fit();}
    addEventListener('resize',layout);
    function go(i){stop();cur=clamp(i,0,pages.length-1);stage.innerHTML='';const sc=mkScene(cur);S=buildScene(sc);stage.appendChild(S.el);S.el.classList.add('on');S.el.style.opacity=1;
      [...pagesEl.children].forEach((b,k)=>b.classList.toggle('cur',k===cur));layout();S.fit();drawScene(S,0);}
    function stop(){playing=false;cancelAnimationFrame(raf);audios.forEach(a=>{a.pause();});document.getElementById('play').textContent='▶ Play';}
    function play(){if(playing)return;playing=true;document.getElementById('play').textContent='❚❚ Pause';const a=audios[cur];a.currentTime=0;vt=0;
      // timeline: in repeat mode, the audio is paused during gaps
      const lines=S.sc.lines;let idx=0;let gapUntil=null;let last=performance.now();
      a.play();
      const tick=(now)=>{if(!playing)return;const dt=(now-last)/1000;last=now;
        if(gapUntil!==null){vt+=dt;if(vt>=gapUntil){gapUntil=null;a.play();}}
        else{const shift=lines.slice(0,idx).reduce((s,l)=>s+(l.gap||0),0);vt=a.currentTime+shift;
          const l=lines[idx];if(l&&l.gap&&a.currentTime>=(l.end-shift)+0.15){a.pause();gapUntil=vt+l.gap-0.15;idx++;}}
        drawScene(S,vt);
        const done=a.ended&&gapUntil===null;
        if(done){stop();if(autoBox.checked&&cur<pages.length-1){go(cur+1);setTimeout(play,350);}return;}
        raf=requestAnimationFrame(tick);};
      raf=requestAnimationFrame(tick);}
    document.getElementById('play').onclick=()=>playing?stop():play();
    document.getElementById('prev').onclick=()=>go(cur-1);
    document.getElementById('next').onclick=()=>go(cur+1);
    repeatBox.onchange=()=>go(cur);
    addEventListener('keydown',e=>{if(e.key===' '){e.preventDefault();if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();playing?stop():play();}if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
    go(0);
  });
}
</script>
</body>
